name: Build FarLands Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Maven project structure
        run: |
          mkdir -p src/main/java/dev/farlands
          mkdir -p src/main/resources
          mv FarLands.java src/main/java/dev/farlands/FarLands.java
          mv plugin.yml src/main/resources/plugin.yml
          mv config.yml src/main/resources/config.yml

      - name: Build with Maven
        run: mvn clean package -B

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: FarLands-plugin
          path: target/FarLands-2.0.0.jar
